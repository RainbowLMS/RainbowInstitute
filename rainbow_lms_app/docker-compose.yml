services:
  rainbow-lms:
    build: .
    container_name: rainbow-restoration-lms
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /data
      NODE_ENV: production
      COOKIE_SECURE: "false"
      TIME_ZONE: America/New_York
    volumes:
      - rainbow_lms_data:/data
volumes:
  rainbow_lms_data:
